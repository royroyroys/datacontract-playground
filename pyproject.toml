[project]
name = "datacontract-playground"
version = "0.1.0"
description = "Local Streamlit playground wrapping datacontract-cli with an ODCS v3.1 example catalogue"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit",
    "streamlit-monaco>=0.1.3",
    "datacontract-cli[duckdb,parquet]>=1.1,<2",
    "nh3>=0.2.18",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["."]
